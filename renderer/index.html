<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Video Automation Tool</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app-shell">
    <header>
      <h1>Video Automation Tool</h1>
      <p>Generate hook + demo videos using bundled FFmpeg.</p>
    </header>

    <main>
      <section class="control-grid">
        <div class="control-row">
          <label>Hook folder</label>
          <div class="input-group">
            <input id="hooksPath" type="text" readonly placeholder="Choose folder with hook videos" />
            <button id="selectHooks">Browse</button>
          </div>
        </div>

        <div class="control-row">
          <label>Demo video</label>
          <div class="input-group">
            <input id="demoPath" type="text" readonly placeholder="Choose the fixed demo video" />
            <button id="selectDemo">Browse</button>
          </div>
        </div>

        <div class="control-row">
          <label>Audio file</label>
          <div class="input-group">
            <input id="audioPath" type="text" readonly placeholder="Choose the fixed audio file" />
            <button id="selectAudio">Browse</button>
          </div>
        </div>

        <div class="control-row captions-row">
          <label>Captions (one per line)</label>
          <textarea id="captions" rows="6" placeholder="Add captions here, one per line."></textarea>
        </div>
      </section>

      <section class="actions">
        <button id="generate">Generate Videos</button>
        <div class="status">
          <span id="statusLabel">Ready</span>
          <div class="progress-bar">
            <div id="progressFill"></div>
          </div>
        </div>
      </section>

      <section class="log-panel">
        <div class="log-header">
          <h2>Status Log</h2>
        </div>
        <pre id="logPanel">No actions yet.</pre>
      </section>
    </main>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
